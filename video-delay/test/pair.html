<!doctype html>
<meta charset="utf-8">
<title>video-delay — pairing test</title>
<!--
  Drives a real pairing between two same-origin iframes: one viewer, one camera.
  The QR path is used deliberately, because it is the only route that works with
  --network none -- the broker is unreachable, the camera's fallback fires, and
  the offer embedded in the pairing code finishes the job over loopback.

  This is the only way to exercise pairing, the delay pipeline and the connected
  layout without two real devices.
-->
<style>
  body { margin: 0; font: 13px/1.5 system-ui, sans-serif; background: #0b0d10; color: #e7edf3; }
  #log { padding: 10px 14px; white-space: pre-wrap; font-family: ui-monospace, monospace; border-bottom: 1px solid #2a323c; }
  #frames { display: flex; gap: 8px; padding: 8px; height: calc(100dvh - 140px); }
  iframe { flex: 1 1 0; height: 100%; border: 1px solid #2a323c; border-radius: 8px; background: #000; }
  body[data-result="pass"] #log { color: #5ad46a; }
  body[data-result="fail"] #log { color: #ff6b6b; }
</style>
<div id="log">starting…</div>
<div id="frames">
  <iframe id="fv" src="../index.html#v" allow="camera; microphone"></iframe>
  <iframe id="fc" allow="camera; microphone"></iframe>
</div>
<script>
const lines = [];
const say = (s) => { lines.push(s); document.getElementById('log').textContent = lines.join('\n'); };

function wait(fn, label, ms = 25000) {
  return new Promise((res, rej) => {
    const t0 = Date.now();
    (function tick() {
      let v = null;
      try { v = fn(); } catch { /* iframe still loading */ }
      if (v) return res(v);
      if (Date.now() - t0 > ms) return rej(new Error('timed out waiting for ' + label));
      setTimeout(tick, 200);
    })();
  });
}

(async () => {
  const fv = document.getElementById('fv'), fc = document.getElementById('fc');
  const V = () => fv.contentDocument, C = () => fc.contentDocument;
  try {
    say('waiting for the viewer to build a pairing code…');
    const code = await wait(() => {
      const t = V().getElementById('mvOffer');
      return t && t.value.length > 100 ? t.value : null;
    }, 'the viewer pairing code', 30000);
    say('viewer pairing code: ' + code.length + ' chars');

    // Go through onScanned, not straight to #j=. The double-join defect lived in
    // onScanned (it set location.hash AND called joinFromQr, and the hashchange
    // called joinFromQr again), so a test that jumps past it cannot catch a
    // regression of the exact bug it is meant to guard.
    fc.src = '../index.html#cam';
    await wait(() => (fc.contentWindow && fc.contentWindow.onScanned) ? true : null,
      'the camera page to load', 20000);
    say('camera loaded; simulating a QR scan');
    fc.contentWindow.onScanned(location.origin + '/index.html#j=' + code);
    const answer = await wait(() => {
      const t = C().getElementById('mcOut');
      return t && t.value.length > 100 ? t.value : null;
    }, 'the camera answer (broker fallback)', 45000);
    say('camera answer: ' + answer.length + ' chars');

    V().getElementById('mvIn').value = answer;
    V().getElementById('mvGo').click();
    say('answer handed back to the viewer');

    await wait(() => V().getElementById('viewer').classList.contains('connected'),
      'the connection', 30000);
    say('CONNECTED');

    // The connection is not the feature. Drop the delay to something short and
    // prove the buffer actually produces delayed output, which is the only part
    // that cannot be inferred from a screenshot.
    fv.contentWindow.setDelay(2);
    say('delay set to 2s; waiting for the buffer to fill…');
    const buffered = await wait(() => {
      const v = V().getElementById('v');
      return v && v.buffered && v.buffered.length && v.buffered.end(v.buffered.length - 1) > 0.5
        ? v.buffered.end(v.buffered.length - 1) : null;
    }, 'the delay buffer to produce output', 30000);
    say('delayed video buffered: ' + buffered.toFixed(1) + 's');

    const v = V().getElementById('v');
    say('delayed video playing: t=' + v.currentTime.toFixed(1) + ' readyState=' + v.readyState);
    if (v.readyState < 2) throw new Error('delayed video never decoded (readyState ' + v.readyState + ')');

    say('viewer hud: ' + (V().getElementById('hud').textContent || '(empty)'));
    say('camera state: ' + (C().getElementById('camState') || {}).textContent);
    say('viewer security: ' + (V().getElementById('vfyPill') || {}).textContent);
    const cPill = C().getElementById('cVfyPill').textContent;
    say('camera security: ' + cPill);

    // One scan must open exactly one camera and register exactly one signalling
    // peer. Two of each is the signature of the double-join defect.
    const camLog = C().getElementById('dbgPre').textContent;
    const gum = (camLog.match(/camera got media/g) || []).length;
    const sigs = (camLog.match(/sig opening as vd-/g) || []).length;
    say('camera opened getUserMedia x' + gum + ', signalling peers x' + sigs);
    if (gum > 1) throw new Error('one scan opened ' + gum + ' cameras — the double-join regressed');
    if (sigs > 1) throw new Error('one scan registered ' + sigs + ' signalling peers — the double-join regressed');
    if (/checking/i.test(cPill)) throw new Error('camera security pill never resolved: ' + cPill);
    if (!C().getElementById('mcAnswerRow').hidden) throw new Error('camera left its answer code on screen after connecting');
    // ---- interval timer -------------------------------------------------
    // `const` at module scope is not on window, so the pipeline state is not
    // reachable from here. The Live button carries the same fact: it is marked
    // `on` exactly when the view has been scrubbed off the live edge.
    const q = V().getElementById.bind(V());
    const replaying = () => q('btnLive').classList.contains('on');

    // Self-view on, so the timer's return-to-live is asserted for BOTH delay
    // lines. Two rapid clicks also exercise the in-flight guard: the second
    // lands inside getUserMedia and must be ignored, not start a second camera.
    q('btnSelf').click();
    q('btnSelf').click();
    await wait(() => !q('pipLive').hidden ? true : null, 'the self-view to open', 15000);
    const vLog = () => q('dbgPre').textContent;
    const webcams = (vLog().match(/webcam on, tracks/g) || []).length;
    say('self-view on; double-click opened ' + webcams + ' webcam(s)');
    if (webcams !== 1) throw new Error('double-click opened ' + webcams + ' webcams — the in-flight guard regressed');

    q('btnTimer').click();
    if (q('tbar').hidden) throw new Error('timer bar did not open');
    q('tPrep').value = 0; q('tWork').value = 2; q('tRest').value = 2; q('tRounds').value = 2;
    q('tReplay').checked = true;
    q('tStart').click();
    say('timer started (work 2s, rest 2s, 2 rounds)');

    await wait(() => q('tbar').dataset.phase === 'work' ? true : null, 'the work phase', 5000);
    say('phase: work, showing ' + q('tTime').textContent);

    // Work ending must rewind the delayed view to the start of the set, which is
    // the reason the timer lives in this app at all.
    await wait(() => q('tbar').dataset.phase === 'rest' ? true : null, 'the rest phase', 12000);
    say('phase: rest, showing ' + q('tTime').textContent);
    if (!replaying()) throw new Error('work ended but the delayed view did not rewind to replay the set');
    say('set replay: delayed view rewound');

    await wait(() => q('tbar').dataset.phase === 'done' ? true : null, 'the timer to finish', 20000);
    say('timer finished: ' + q('tPhase').textContent);
    if (replaying()) throw new Error('timer finished but the view was left in replay');
    say('returned to live at the end');

    // ---- rep detector -----------------------------------------------------
    // The detector is pure (scalars in, reps out), so it can be asserted to an
    // exact count against a synthetic signal — no video, no tolerance for
    // "looks about right", and it fails loudly if the maths regresses.
    const R = fv.contentWindow.VDReps;
    if (!R || !R.makeRepDetector) throw new Error('reps.js did not load into the viewer');
    const feed = (fn, ms, opts) => {
      const det = R.makeRepDetector(opts); let n = 0;
      for (let t = 0; t <= ms; t += 50) if (det.push(fn(t), t)) n++;
      return n;
    };
    const TAU = Math.PI * 2;
    const cases = [
      ['10 cycles @2s',      t => Math.sin(TAU * t / 2000) * 40 + 100, 20000, 9, 10],
      ['10 cycles + noise',  t => Math.sin(TAU * t / 2000) * 40 + 100 + Math.sin(t * 7.3) * 4, 20000, 9, 10],
      ['5 slow cycles @10s', t => Math.sin(TAU * t / 10000) * 40 + 100, 50000, 4, 5],
      ['flat, no reps',      () => 100, 20000, 0, 0],
      ['jitter, no reps',    t => 100 + Math.sin(t * 11) * 0.7, 20000, 0, 0],
      ['drift, no reps',     t => 100 + t / 500, 20000, 0, 0],
      // Targets hysteresis specifically. The ripple's amplitude is chosen so its
      // SLOPE exceeds the carrier's — below that it can never reverse the
      // signal's direction and the test proves nothing however the threshold is
      // set. At 32 it genuinely creates false turns: 9 reps with the guard, 19
      // without.
      ['ripple on real reps', t => Math.sin(TAU * t / 2000) * 40 + Math.sin(TAU * t / 1000) * 32 + 100, 20000, 8, 11],
      // Targets the minimum period: full amplitude, but 400ms a cycle. Nothing
      // a human lifts moves like this, and only minPeriod rejects it.
      ['too fast to be reps', t => Math.sin(TAU * t / 400) * 40 + 100, 20000, 0, 0],
    ];
    for (const [label, fn, ms, lo, hi] of cases) {
      const n = feed(fn, ms);
      say('detector: ' + label + ' -> ' + n + ' (expect ' + lo + '-' + hi + ')');
      if (n < lo || n > hi) throw new Error('detector counted ' + n + ' for ' + label + ', expected ' + lo + '-' + hi);
    }

    // And the UI wires up against the live feed without throwing.
    q('btnReps').click();
    if (q('repbar').hidden) throw new Error('rep bar did not open');
    q('repRun').click();
    await new Promise(r => setTimeout(r, 2500));
    say('rep detection ran on the live feed; state=' + q('repState').textContent +
        ' count=' + q('repCount').textContent);
    q('repRun').click();

    document.body.dataset.result = 'pass';
  } catch (e) {
    say('FAILED: ' + e.message);
    try { say('viewer status: ' + V().getElementById('sigState').textContent); } catch {}
    try { say('camera status: ' + C().getElementById('camState').textContent); } catch {}
    document.body.dataset.result = 'fail';
  }
})();
</script>
